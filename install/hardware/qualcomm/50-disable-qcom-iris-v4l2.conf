## The Snapdragon "qcom-iris" hardware video decoder/encoder (/dev/video0,
## /dev/video1) is not a camera. Opening it from WirePlumber's V4L2 monitor
## fails with EINVAL and the async create-device hook never completes, which
## stalls WirePlumber's event dispatcher: no audio sinks/streams get linked.
## Cameras on this laptop are handled by libcamera, so skip these devices.
monitor.v4l2.rules = [
  {
    matches = [
      { device.name = "~v4l2_device.platform-aa00000.video-codec*" }
    ]
    actions = { update-props = { device.disabled = true } }
  }
]
