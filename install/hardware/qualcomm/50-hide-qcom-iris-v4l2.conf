## Hide the Snapdragon iris decoder from PipeWire's camera list.
##
## This does not disable hardware decoding. mpv (v4l2m2m-copy), GStreamer
## (v4l2h264dec, v4l2h265dec, v4l2vp9dec), and any other client can still
## open the V4L2 device.
##
## WirePlumber's V4L2 monitor treats the qcom-iris stateful decoder and
## encoder at platform aa00000 (/dev/video0, /dev/video1) as cameras.
## Opening them fails with EINVAL, the async create-device hook never
## finishes, and WirePlumber's event dispatcher stalls, so no audio sinks
## get linked. Cameras on these laptops are libcamera devices, not these
## nodes. device.disabled only stops that camera enumeration.
monitor.v4l2.rules = [
  {
    matches = [
      { device.name = "~v4l2_device.platform-aa00000.video-codec*" }
    ]
    actions = { update-props = { device.disabled = true } }
  }
]
