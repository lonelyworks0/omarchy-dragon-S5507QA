## The WSA884x speakers on the Vivobook S 15 Snapdragon X Plus have no
## full speaker-protection path on Linux. 1.0 is full scale; this clamps
## the speaker sink so the volume slider cannot drive them there.
## Headphones use a different node and are left alone.
## Remove with: omarchy hw vivobook s5507qa uninstall

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*HiFi__Speaker__sink"
      }
    ]
    actions = {
      update-props = {
        channelmix.max-volume = 0.4
      }
    }
  }
]
