# Vivobook S 15 S5507QA tuning, applied only while the power-saver profile is active.
# Balanced and performance stay with power-profiles-daemon.
#
# Edit, then: sudo systemctl restart omarchy-vivobook-power.service
#             systemctl --user restart omarchy-vivobook-power-display.service
# Remove:     omarchy power vivobook uninstall

# CPU ceiling in power-saver, in kHz. power-profiles-daemon caps this machine
# at 1920000, which stalls a burst of Chromium tabs. 2611200 is its balanced
# ceiling. Empty leaves power-profiles-daemon's cap alone. Each policy is
# clamped to its own cpuinfo_max_freq.
CPU_CAP_KHZ=2611200

# GPU devfreq ceiling in power-saver, in Hz. Snapped down to an advertised
# OPP. Empty leaves the GPU uncapped. This Adreno idles at 280 MHz.
GPU_CAP_HZ=666000000

# 1 turns Wi-Fi power save on for power-saver and off again when leaving it.
# Omarchy's NetworkManager drop-in keeps wifi.powersave = 2 (disabled). This
# file does not change that drop-in. NetworkManager can clear the flag when
# the link reconnects, so the watcher sets it again while power-saver remains.
WIFI_POWERSAVE=1

# Internal panel refresh in power-saver, in Hz. The connector, the mode to
# restore, and the scale come from Hyprland when the profile changes. 0 leaves
# the panel alone, including a refresh rate chosen by hand.
PANEL_SAVER_HZ=60
